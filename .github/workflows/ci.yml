name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fraud-api .
      - name: smoke test the container
        run: |
          docker run -d -p 8000:8000 --name api fraud-api
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/score -H 'Content-Type: application/json' \
            -d '{"step":10,"type":"TRANSFER","amount":181.0,"nameOrig":"C1","oldbalanceOrg":181.0,"nameDest":"C2","oldbalanceDest":0.0}'
